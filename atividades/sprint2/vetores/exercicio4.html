<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="">informe os filmes que voce mais gosta
        <input type="text" name="" id="inp_filme">
    </label>
    <button onclick="enviar()">Cadastrar filme</button>
    <button onclick="Favoritos()">Ver Favoritos</button>
    <span id="exibir"></span>
</body>
</html>

<script>
    let lista = []
    function enviar(){
        let filme = inp_filme.value
        lista.push(filme)
    }
    function Favoritos(){
        exibir.innerHTML=`Total: ${lista.length} <br>`
        exibir.innerHTML+=`O que filme que mais gosta é ${lista[0]}<br>`
        exibir.innerHTML+=`E desses, o que menos gosta é ${lista[lista.length-1]}<br>`
    }
</script>

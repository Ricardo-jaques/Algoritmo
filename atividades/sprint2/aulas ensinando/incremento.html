<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="incrementar()">incrementar</button>
    <br>
    <span id="exibir"></span>
</body>
</html>

<script>
    let numero = 0;
        

    function incrementar(){
        let limite = 10;
        while(numero<=limite){
           exibir.innerHTML += exibir.innerHTML=`${numero}<br>`
            numero ++
            
        }
    }
</script>

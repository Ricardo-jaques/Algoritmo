<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label> de quantos em quantos dias vode fas musculação;
        <input type="text" name="" id="inp_musculacao">
    </label>
    <br>
    <button onclick="enviar()">Exibir rotina mensal</button>
    <br>
    <span id="exibir"></span>
</body>
</html>

<script>
    function enviar(){
let contagem = 0
let musculacao = inp_musculacao.value

while(contagem<30){
    contagem++
    
    if((contagem-1) % musculacao == 0){
        
        exibir.innerHTML+=`Dia ${contagem} - Musculação<br> `
        
    }else{
        
        exibir.innerHTML+=`Dia ${contagem} - Comer, dormir etc<br>`
        
    }
   
}
    }
</script>

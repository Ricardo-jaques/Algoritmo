<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for=""> informe a quantidade de elefantes
        <input type="text" name="" id="inp_elefantes">
    </label>
    <button onclick="enviar()">Atazanar a médium</button>
    <br>
    <span id="exibir"></span>
</body>
</html>
<script>

function enviar(){

    let elefante = inp_elefantes.value;
    let incomodam = 'incomodam,';
    let somando = incomodam;

    let contagem=2
        while(contagem<=elefante){
             somando+=incomodam
           
            exibir.innerHTML+=`1  elefante incomoda muita gente!<br> ${contagem} elefantes,${somando} muito mais!<br>`
            contagem++
            
        }
}
</script>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="contador()">Contar</button>
    <br>
    <span id="exibir"></span>
</body>
</html>

<script>
    function contador(){
       let numero=0

       while(numero<=15){
        exibir.innerHTML+=`${numero}<br>`
        numero++
       }
    }
</script>

<head>

<body>
    <label for=""> informe um numero
        <input type="text" name="" id="inp_numero">
    </label>
    <label for="inp_numero"> insira uma frase
        <input type="text" name="" id="inp_frase">
    </label>
    <button onclick="enviar()">Papagaio Repetitivo</button>
    <br>
    <span id="exibir"></span>
</body>

<script>

function enviar(){

    let numero = inp_numero.value;
    let frase = inp_frase.value;
    let somando = frase
    let contagem=1
        while(contagem<=numero){
            alert(`${contagem}-${somando}`)
            somando+= frase
            contagem++
        }
}
</script>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="Receber()">Receber 100</button>
    <button onclick="Pagar()">Pagar 50</button>
    <div id="exibir"></div>
</body>
</html>

<script>
    let valor = 0
    function Receber(){
        valor +=100;
        exibir.innerHTML=`Transferência de R$100 recebida! Saldo atual: R$${valor}`
    }
    function Pagar(){
        valor -=50;
        exibir.innerHTML=`Pagamento de R$50 efetuado! Saldo atual: R$${valor}`
    }

</script>

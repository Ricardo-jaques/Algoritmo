<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Informe a sua altura
        <input type="text" name="" id="inp_altura">
    </p>
    <button onclick="enviar()">Analisar Estatura</button>
    <div id="receba"></div>
</body>
</html>

<script>
    function enviar(){
    let altura = Number(inp_altura.value)
    
    if(altura <= 1.65){
        receba.innerHTML=`Você pode ser piloto de corrida`
    } else if(altura <1.80){
        receba.innerHTML=`Você pode ser jogador de futebol`

    }
    else{
        receba.innerHTML=`Você pode ser jogador de vôlei ou basquete`

    }
}
</script>

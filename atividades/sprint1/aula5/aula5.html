<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
</head>
<body>
    <button onclick="incrementar()">incrementar</button>
    <div id="Display"></div>
</body>
</html>

<script>

    let contador = 0

    function incrementar(){
        contador+=1
        Display.innerHTML=Display.innerHTML+`contador = ${contador}<br>`
        
    }
</script>
